; ============================================================
; B.A.N. — PlatformIO Project Configuration
; Raian AI Network — ESP32 Firmware
;
; Version 1.0: Bluetooth Classic SPP (main.cpp)
; Version 2.0: BLE GATT + Web Bluetooth (main_ble.cpp)
;
; To switch to v2.0 (Web HCI):
;   1. Delete or rename src/main.cpp
;   2. Rename src/main_ble.cpp to src/main.cpp
;   3. Build and upload
;
; Board: DOIT ESP32 DevKit V1, ESP32-WROOM-32, or equivalent
; Upload: pio run --target upload
; Monitor: pio device monitor --baud 115200
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ─── Serial monitor ──────────────────────────────────────────
monitor_speed = 115200

; ─── Libraries ────────────────────────────────────────────────
; ArduinoJson: JSON parsing for memory.json, BLE protocol
; BLE is built into the ESP32 Arduino core — no extra install needed
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5

; ─── Build flags ──────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1

; ─── Partition scheme ─────────────────────────────────────────
; BLE requires more flash — use the bluetooth partition scheme
; which gives 1.2MB for app and disables OTA
board_build.partitions = min_spiffs.csv

; ─── Upload ──────────────────────────────────────────────────
upload_speed = 921600
