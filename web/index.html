<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="R.A.N. — Raian AI Network. Your personal embedded AI assistant and companion." />
    <title>R.A.N. — Raian AI Network</title>

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080c14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="R.A.N." />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Favicon: dynamically randomized from /character/ frames -->
    <link id="app-favicon" rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Dynamic Random Character Favicon Selector Script -->
    <script>
      (function() {
        const characterFrames = [
          'IDLE 1.png', 'IDLE 2.png', 'IDLE 3.png', 'IDLE 4.png',
          'WAVE 1.png', 'WAVE 2.png', 'WAVE 3.png', 'WAVE 4.png',
          'HAPPY 1.png', 'HAPPY 2.png', 'HAPPY 3.png', 'HAPPY 4.png',
          'TALKING 1.png', 'TALKING 2.png', 'TALKING 3.png', 'TALKING 4.png',
          'RUNNING 1.png', 'RUNNING 2.png', 'RUNNING 3.png', 'RUNNING 4.png',
          'WALKING 1.png', 'WALKING 2.png', 'WALKING 3.png', 'WALKING 4.png',
          'WONDERING 1.png', 'WONDERING 2.png', 'WONDERING 3.png',
          'SHOCK 1.png', 'SHOCK 2.png', 'SHOCK 3.png',
          'ANGRY 1.png', 'ANGRY 2.png', 'ANGRY 3.png',
          'SAD 1.png', 'SAD 2.png'
        ];
        const randomFrame = characterFrames[Math.floor(Math.random() * characterFrames.length)];
        const faviconLink = document.getElementById('app-favicon');
        if (faviconLink) {
          faviconLink.href = '/character/' + encodeURIComponent(randomFrame);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
